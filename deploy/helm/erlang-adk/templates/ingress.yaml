{{- if .Values.ingress.enabled }}
{{- if not .Values.service.enabled }}
{{- fail "service.enabled must be true when ingress.enabled=true" }}
{{- end }}
{{- if not .Values.ingress.tls.enabled }}
{{- fail "TLS must be enabled for the Erlang ADK ingress" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "erlang-adk.fullname" . }}
  labels:
    {{- include "erlang-adk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ required "ingress.host is required" .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required" .Values.ingress.tls.secretName | quote }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "erlang-adk.fullname" . }}
                port:
                  name: http
{{- end }}
